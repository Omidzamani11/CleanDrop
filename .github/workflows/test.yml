name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Provision Windows OCR and metadata tools
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\provision_windows_tools.ps1

      - name: Install Linux OCR, metadata, Qt, and fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 libgl1 libimage-exiftool-perl \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-fas \
            fonts-noto-core

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src/cleandrop

      - name: Tests and coverage
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
        run: python -m pytest --cov=cleandrop --cov-branch --cov-fail-under=85
