name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Ensure tag matches package
        shell: powershell
        run: |
          $env:PYTHONPATH = Join-Path $pwd "src"
          $package = python -c "import cleandrop; print(cleandrop.__version__)"
          if ($package -ne "${{ steps.version.outputs.version }}") {
            throw "Tag version does not match package version $package"
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Provision pinned local tools
        shell: powershell
        run: .\scripts\provision_windows_tools.ps1

      - name: Build, test, and package
        shell: powershell
        run: |
          .\scripts\build_windows.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Python (Get-Command python).Source

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanDrop-${{ steps.version.outputs.version }}-windows
          if-no-files-found: error
          path: |
            dist/CleanDrop-${{ steps.version.outputs.version }}-win-x64.zip
            dist/installer/CleanDrop-Setup-${{ steps.version.outputs.version }}.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: CleanDrop ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/CleanDrop-${{ steps.version.outputs.version }}-win-x64.zip
            dist/installer/CleanDrop-Setup-${{ steps.version.outputs.version }}.exe
            dist/SHA256SUMS.txt
