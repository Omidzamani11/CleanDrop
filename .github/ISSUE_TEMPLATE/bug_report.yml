name: Bug report
description: Report a reproducible CleanDrop problem using synthetic data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private files or real personal data. Security issues belong in a private Security Advisory.
  - type: input
    id: version
    attributes:
      label: CleanDrop version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: File format
      options:
        - JPG / JPEG
        - PNG
        - PDF
        - Application startup or installer
        - CLI
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use only synthetic test data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result and error code
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed real PII, private paths, documents, and credentials.
          required: true
